services:
  gateway:
    image: traefik:v3.0
    container_name: newsense_gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # We trust forwarded headers because we might be behind Caddy/Nginx
      - "--entrypoints.web.forwardedHeaders.insecure=true"
    networks:
      - internal_backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: pgvector/pgvector:pg16
    container_name: newsense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: newsense_valkey
    restart: unless-stopped
    networks:
      - internal_backend
    volumes:
      - valkey_data:/data

  auth:
    build: ./services/auth
    image: ghcr.io/rhusiev/newsense-auth:${VERSION:-latest}
    container_name: newsense_auth
    restart: unless-stopped
    networks:
      - internal_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_URL: https://${WEB_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/admin`) || PathPrefix(`/auth`))"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
    volumes:
      - ./services/auth:/app

  users:
    build: ./services/users
    image: ghcr.io/rhusiev/newsense-users:${VERSION:-latest}
    container_name: newsense_users
    restart: unless-stopped
    networks:
      - internal_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_URL: https://${WEB_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.routers.users.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/feeds`) || PathPrefix(`/settings`))"
      - "traefik.http.services.users.loadbalancer.server.port=3001"
    volumes:
      - ./services/users:/app

  aggregator:
    build: ./services/aggregator
    image: ghcr.io/rhusiev/newsense-aggregator:${VERSION:-latest}
    container_name: newsense_aggregator
    restart: unless-stopped
    networks:
      - internal_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_URL: https://${WEB_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      LLM_SUMMARIES_ENABLED: ${LLM_SUMMARIES_ENABLED:-0}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aggregator.entrypoints=web"
      - "traefik.http.routers.aggregator.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/items`) || PathPrefix(`/clusters`))"
      - "traefik.http.services.aggregator.loadbalancer.server.port=3002"
    volumes:
      - ./services/aggregator:/app

  fetcher:
    build: ./services/fetcher
    image: ghcr.io/rhusiev/newsense-fetcher:${VERSION:-latest}
    container_name: newsense_fetcher
    restart: unless-stopped
    networks:
      - internal_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      RUST_LOG: info
      FETCH_INTERVAL_SECONDS: 300
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./services/fetcher:/app

  embeddings:
    build: ./services/embeddings
    image: ghcr.io/rhusiev/newsense-embeddings:${VERSION:-latest}
    container_name: newsense_embeddings
    restart: unless-stopped
    networks:
      - internal_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      RECONCILIATION_INTERVAL_MINUTES: 10
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:-}
      LLM_PROVIDER_ROUTING: ${LLM_PROVIDER_ROUTING:-}
      LLM_SUMMARIES_ENABLED: ${LLM_SUMMARIES_ENABLED:-0}
      LLM_REASONING: ${LLM_REASONING:-}
      LLM_SUMMARY_MAX_TOKENS: ${LLM_SUMMARY_MAX_TOKENS:-700}
      LLM_SUMMARY_INTERVAL_MINUTES: ${LLM_SUMMARY_INTERVAL_MINUTES:-5}
      THREAD_LLM_ENABLED: ${THREAD_LLM_ENABLED:-0}
      THREAD_LLM_THRESHOLD: ${THREAD_LLM_THRESHOLD:-0.7}
      THREAD_LLM_MAX_CALLS: ${THREAD_LLM_MAX_CALLS:-2000}
      THREAD_LLM_DAILY_CALLS: ${THREAD_LLM_DAILY_CALLS:-1000}
      THREAD_LLM_MAX_CHARS: ${THREAD_LLM_MAX_CHARS:-700}
      THREAD_LLM_CONCURRENCY: ${THREAD_LLM_CONCURRENCY:-8}
      THREAD_TWO_HOP: ${THREAD_TWO_HOP:-0}
      THREAD_PAIR_MODEL: ${THREAD_PAIR_MODEL:-}
      THREAD_PAIR_THRESHOLD: ${THREAD_PAIR_THRESHOLD:-0.5}
      THREAD_PAIR_MAX_LEN: ${THREAD_PAIR_MAX_LEN:-128}
      THREAD_PAIR_BATCH: ${THREAD_PAIR_BATCH:-64}
      THREAD_ALTERNATIVE_MIN: ${THREAD_ALTERNATIVE_MIN:-0.35}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./services/embeddings:/app

networks:
  internal_backend:

volumes:
  postgres_data:
  valkey_data:
